[project]
name = "tai-bot"
version = "0.1.0"
description = "Hindi / Hinglish / English mental-health support chatbot (RAG + safety-first crisis handling)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tai_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=tai_bot --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow Devanagari / ambiguous unicode in strings

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literal test fixtures are clearer on one line

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["ai4bharat.*"]
ignore_missing_imports = true
